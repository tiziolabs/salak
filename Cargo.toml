[package]
name = "salak"
version = "0.1.0"
description = "A lightweight Markdown reader"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[features]
# Embed the `ui/` assets in the binary so a plain `cargo build` produces a
# working executable, without needing the Tauri CLI or a dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
