[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77"
authors = ["Timothe Tizio <t.tizio@mailbox.org>"]
repository = "https://github.com/tiziolabs/salak"

# Profiles are ignored in member crates, so they live here.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
