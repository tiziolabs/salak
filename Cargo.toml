[workspace]
# salak-tauri has its own workspace, so that the lock file and the dependency
# resolution of the Linux crates, packaged by Debian, never see Tauri.
members = ["crates/salak-core", "crates/salak-gtk"]
exclude = ["crates/salak-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77"
authors = ["Timothe Tizio <t.tizio@mailbox.org>"]
repository = "https://github.com/tiziolabs/salak"

# Profiles are ignored in member crates, so they live here. `release` keeps
# Cargo's defaults, which distributions expect (Debian keeps the symbols for
# its -dbgsym packages). The packages of the GitHub releases use `dist`,
# tuned for size: `cargo deb -p salak-gtk --profile dist`.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
