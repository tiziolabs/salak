<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Salak</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-header">
      <div id="root-name"></div>
      <button id="hide-sidebar" class="sidebar-toggle" title="Hide the sidebar (b)" aria-label="Hide the sidebar" aria-controls="sidebar" aria-expanded="true">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/>
          <path d="M6 3v10" stroke="currentColor"/>
          <path d="M2 3h4v10H2z" fill="currentColor" opacity=".35"/>
        </svg>
      </button>
    </div>
    <ul id="tree" role="tree" tabindex="0"></ul>
  </aside>
  <div id="sidebar-grip" role="separator" aria-orientation="vertical" aria-controls="sidebar"></div>
  <section id="welcome" hidden>
    <img src="logo.svg" alt="" width="96" height="96">
    <h1>Salak</h1>
    <p>Open a Markdown file, or a folder to browse its files.</p>
    <div class="actions">
      <button id="open-file">Open File… <kbd>Ctrl+O</kbd></button>
      <button id="open-folder">Open Folder… <kbd>Ctrl+Shift+O</kbd></button>
    </div>
    <section id="recent" hidden>
      <h2>Recent</h2>
      <ul id="recent-list"></ul>
    </section>
    <p class="hint">New to Salak? Read the <a id="open-guide" href="#">user guide</a> (<kbd>F1</kbd>).</p>
  </section>
  <div id="pane">
    <div id="toolbar">
      <button id="show-sidebar" class="sidebar-toggle" title="Show the sidebar (b)" aria-label="Show the sidebar" aria-controls="sidebar" aria-expanded="true">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/>
          <path d="M6 3v10" stroke="currentColor"/>
        </svg>
      </button>
      <div id="tabs" role="tablist"></div>
    </div>
    <main id="content" tabindex="-1">
      <div id="banner" role="alert" hidden></div>
      <div id="doc"></div>
    </main>
  </div>
  <dialog id="about" aria-labelledby="about-name">
    <img src="logo.svg" alt="" width="72" height="72">
    <h2 id="about-name">Salak</h2>
    <p class="tagline">A lightweight Markdown reader</p>
    <dl>
      <dt>Version</dt><dd id="about-version"></dd>
      <dt>License</dt><dd id="about-license"></dd>
      <dt>Developer</dt><dd id="about-author"></dd>
      <dt>Source</dt><dd><a id="about-repository" href=""></a></dd>
    </dl>
    <form method="dialog"><button autofocus>Close</button></form>
  </dialog>
  <div id="tab-menu" role="menu" hidden>
    <button role="menuitem" data-action="close">Close This Tab</button>
    <button role="menuitem" data-action="close-others">Close Other Tabs</button>
    <button role="menuitem" data-action="close-right">Close Tabs to the Right</button>
    <button role="menuitem" data-action="close-left">Close Tabs to the Left</button>
  </div>
</body>
</html>
