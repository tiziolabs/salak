[package]
name = "salak-tauri"
# Outside the root workspace (see its Cargo.toml): keep these fields in step
# with its [workspace.package].
version = "0.1.0"
description = "A lightweight Markdown reader"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77"
authors = ["Timothe Tizio <t.tizio@mailbox.org>"]
repository = "https://github.com/tiziolabs/salak"
publish = false

[[bin]]
name = "salak"
path = "src/main.rs"

# A workspace of its own: its target/ and Cargo.lock live in this folder.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
salak-core = { path = "../salak-core", version = "0.1.0" }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }
ammonia = "4"
notify = "8"
tauri-plugin-dialog = "2"
# Pure Rust regex engine: no dependency on the Oniguruma C library.
syntect = { version = "5", optional = true, default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }

[features]
# Embed the `ui/` assets in the binary so a plain `cargo build` produces a
# working executable, without needing the Tauri CLI or a dev server.
default = ["custom-protocol", "highlight"]
custom-protocol = ["tauri/custom-protocol"]
# Syntax highlighting of code blocks. Disable it for a smaller binary with
# `cargo build --release -p salak-tauri --no-default-features --features custom-protocol`.
highlight = ["dep:syntect"]

# Profiles are only read from the workspace root, which is this crate.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
