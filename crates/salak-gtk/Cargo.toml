[package]
name = "salak-gtk"
version.workspace = true
description = "A lightweight Markdown reader, native GTK 4 and libadwaita application"
license.workspace = true
edition.workspace = true
# gtk4 0.11 and glib 0.22, the versions of Debian unstable, need Rust 1.92
# (see P2 of docs/debian-packaging.md).
rust-version = "1.92"
authors.workspace = true
repository.workspace = true
publish = false
include = ["src/**", "data/**", "Cargo.toml"]

[[bin]]
name = "salak"
path = "src/main.rs"

[dependencies]
salak-core = { path = "../salak-core", version = "0.1.0" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
sourceview5 = { version = "0.11", optional = true }

[features]
default = ["highlight"]
# Syntax highlighting of code blocks with GtkSourceView.
highlight = ["dep:sourceview5"]

# `cargo deb -p salak-gtk --profile dist` builds the Debian package of the
# GitHub releases in target/debian/; cargo-deb reads the binary from the
# folder of the profile and compresses the man page.
[package.metadata.deb]
name = "salak"
section = "text"
extended-description = """\
Salak shows the Markdown files of a folder in a tree, and renders the selected \
one: tables, footnotes, task lists and highlighted code blocks, in light and \
dark modes. It reloads files changed on disk and applies a user theme."""
# Shared libraries (GTK 4, libadwaita, GtkSourceView) are found by dpkg-shlibdeps.
depends = "$auto"
assets = [
    ["../../target/release/salak", "usr/bin/", "755"],
    ["data/com.tiziolabs.salak.desktop", "usr/share/applications/", "644"],
    ["data/com.tiziolabs.salak.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/salak.1", "usr/share/man/man1/", "644"],
    ["data/icons/com.tiziolabs.salak.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/com.tiziolabs.salak.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../README.md", "usr/share/doc/salak/", "644"],
]
