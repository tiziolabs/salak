[package]
name = "salak-gtk"
version.workspace = true
description = "A lightweight Markdown reader, native GTK 4 and libadwaita application"
license.workspace = true
edition.workspace = true
# gtk4 0.11 needs Rust 1.92 (see D1 of docs/gtk-migration-plan.md).
rust-version = "1.92"
authors.workspace = true
repository.workspace = true
publish = false
include = ["src/**", "data/**", "Cargo.toml"]

[[bin]]
name = "salak"
path = "src/main.rs"

[dependencies]
salak-core = { path = "../salak-core", version = "0.1.0" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
sourceview5 = { version = "0.11", optional = true }

[features]
default = ["highlight"]
# Syntax highlighting of code blocks with GtkSourceView.
highlight = ["dep:sourceview5"]
